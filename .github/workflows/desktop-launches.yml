name: desktop launches

on:
  push:
    branches: [main, 'feat/windows-desktop*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        timeout-minutes: 10
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binutils curl wget git python3 xvfb openbox xdotool x11-utils sway gcc pkg-config libwayland-dev wayland-protocols strace zsh fish tcsh
      - name: Build
        run: ./build.sh test
      - name: Full editor tests
        shell: bash
        env:
          RHUN_TEST_ARTIFACTS: build/stabilization/linux
        run: tests/run.sh 2>&1 | tee build/editor-tests.log
      - name: Installer and download failures
        run: |
          sh tests/install.sh
          python3 tests/install-download.py
      - name: Native file launches
        run: |
          python3 tests/linux-launch.py
          python3 tests/linux-launch.py --wayland
      - name: Native wheel and touchpad scrolling
        run: |
          python3 tests/linux-scroll.py
          python3 tests/linux-scroll.py --wayland
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-stabilization
          path: |
            build/editor-tests.log
            build/stabilization/

  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./build.sh test
      - name: Full editor tests and Finder launches
        shell: bash
        env:
          RHUN_TEST_ARTIFACTS: build/stabilization/macos
        run: tests/run.sh 2>&1 | tee build/editor-tests.log
      - name: Installer and download failures
        run: |
          sh tests/install.sh
          python3 tests/install-download.py
          python3 tests/mac-defaults.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-stabilization
          path: |
            build/editor-tests.log
            build/stabilization/
