# a WebAssembly extension: no program for any system, one module for all
name = wasmtest-go
owner = rhun-tests
title = Wasm Test (Go)
version = 0.1.0
protocol = 1
run.wasm32-wasip1 = bin/wasmtest-go.wasm
on = command

[commands]
hello = Hello
upper = Upper
env = Env
files = Files
project = Project
escape = Escape
time = Time
spin = Spin
trap = Trap
tick = Tick
own = Own
exit = Exit

[needs]
documents = write
