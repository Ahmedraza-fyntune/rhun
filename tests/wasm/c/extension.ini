# a WebAssembly extension: no program for any system, one module for all
name = wasmtest-c
owner = rhun-tests
title = Wasm Test (C)
version = 0.1.0
protocol = 1
run.wasm32-wasip1 = bin/wasmtest-c.wasm
on = command

[commands]
hello = Hello
upper = Upper
env = Env
files = Files
project = Project
escape = Escape
time = Time
spin = Spin
trap = Trap
exit = Exit

[needs]
documents = write
