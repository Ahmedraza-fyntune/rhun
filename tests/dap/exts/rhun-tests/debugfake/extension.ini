# The fake debugger extension, for the debugger's host tests (tests/debug-*.py). Its adapter is
# tests/dap/fakedap.py; its own program (tests/dap/debugfake.py) answers debug-resolve.
name = debugfake
owner = rhun-tests
title = Debug Fake
description = A fake debugger for the host tests.
version = 0.0.1
protocol = 1
runtime = python3
run = ../../../debugfake.py
on = command

[needs]
debug = yes

[commands]
start = Debug Fake: Start
stop = Debug Fake: Stop

[debugger.fake]
title = Fake Debugger
languages = Python C
program = python3
args = -I ${extension}/../../../fakedap.py --count ${config:count|42}
install = pip install fakedap
templates = templates/fake.ini
attr.program = path
attr.stopOnEntry = bool
attr.args = list
attr.env = map
attr.count = int
attr.mode = choice debug test

[debugger.faketcp]
title = Fake Debugger over TCP
program = python3
args = -I ${extension}/../../../fakedap.py --listen 127.0.0.1:${port}
transport = tcp
attr.program = path
attr.stopOnEntry = bool

[debugger.fakeres]
title = Fake Debugger with a resolver
program = python3
args = -I ${extension}/../../../fakedap.py
resolve = yes
attr.program = path
attr.stopOnEntry = bool
attr.count = int
