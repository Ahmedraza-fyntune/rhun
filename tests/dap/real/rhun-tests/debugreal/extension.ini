# Real debug adapters for tests/debug-real.py: lldb-dap (C), Delve (Go) and debugpy (Python), as
# the first-party rhun-editor/debug extension declares them, without its resolver.
name = debugreal
owner = rhun-tests
title = Debug Real
description = Real debug adapters for the host tests.
version = 0.0.1
protocol = 1

[needs]
debug = yes

[debugger.c]
title = C and C++ (lldb-dap)
languages = C C++
program = lldb-dap lldb-dap-20 lldb-dap-19 lldb-dap-18
program.macos-arm64 = xcrun
args.macos-arm64 = lldb-dap
attr.program = path
attr.args = list
attr.cwd = path
attr.env = map
attr.stopOnEntry = bool
attr.pid = int
attr.initCommands = list

[debugger.go]
title = Go (Delve)
languages = Go
program = dlv
args = dap --listen=127.0.0.1:${port}
transport = tcp
attr.mode = choice debug test exec core replay remote local
attr.program = path
attr.args = list
attr.buildFlags = list
attr.env = map
attr.cwd = path
attr.stopOnEntry = bool
attr.processId = int

[debugger.python]
title = Python (debugpy)
languages = Python
program = ${config:python|python3}
args = -m debugpy.adapter
attr.program = path
attr.module = string
attr.args = list
attr.cwd = path
attr.env = map
attr.python = path
attr.stopOnEntry = bool
attr.justMyCode = bool
attr.console = choice internalConsole integratedTerminal externalTerminal
