# A fake language provider for notebook cells (tests/ext/cellfake.py): it agrees notebooks, so rhun
# reports the Python cells of open notebooks to it as documents, and answers completion in them.
name = cellfake
owner = rhun-tests
title = Cell Provider
description = Logs the cell documents it hears of and completes in them.
version = 0.0.1
protocol = 1
runtime = python3
run = ../../../cellfake.py
on = startup

[provides]
complete = *.py

[subscribe]
opened = *.py
changed = *.py
edits = *.py

[needs]
documents = read
