# A fake notebook extension for the host tests (tests/ext/nbfake.py): a line-based toy format.
name = nbfake
owner = rhun-tests
title = Fake Notebooks
description = Reads and writes .nbt notebooks and runs their cells by echoing them.
version = 0.0.1
protocol = 1
runtime = python3
run = ../../../nbfake.py
on = command

[commands]
hello = Fake Hello

[provides]
notebook = *.nbt
notebook.title = Toy Notebook
notebook.kernel = yes

[needs]
# kernels it may start as the user (nb-exec)
kernels = python3
