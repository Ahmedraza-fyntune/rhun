# A busy extension that agrees no features (tests/ext/plainfake.py): it sends its status text all
# the time, so it is often the last extension rhun read from. Notebook cells are not reported to it.
name = plainfake
owner = rhun-tests
title = Plain Busy
description = Sends its status text every 10 ms.
version = 0.0.1
protocol = 1
runtime = python3
run = ../../../plainfake.py
on = startup
