# A fake text-model custom editor for the host tests (tests/ext/edfake.py): rhun keeps the file's
# DOC; a click upper-cases its first line through replace. Only through Reopen With (option).
name = edupper
owner = rhun-tests
title = Upper Viewer
description = Shows .up files and upper-cases their first line.
version = 0.0.1
protocol = 1
runtime = python3
run = ../../../edfake.py
args = text
on = open:*.up

[provides]
editor = *.up *.txt
editor.title = Upper Viewer
editor.model = text
editor.priority = option

[subscribe]
opened = *.up *.txt

[needs]
documents = write
