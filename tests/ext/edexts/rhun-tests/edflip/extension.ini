# A fake owned-model custom editor for the host tests (tests/ext/edfake.py): it keeps the file's
# bytes itself, flips the first one on a click, and saves in parts of 3 bytes.
name = edflip
owner = rhun-tests
title = Byte Flipper
description = Flips bytes of .flip files.
version = 0.0.1
protocol = 1
runtime = python3
run = ../../../edfake.py
args = owned
on = open:*.flip

[provides]
editor = *.flip
editor.title = Byte Flipper
editor.model = owned
editor.priority = default
