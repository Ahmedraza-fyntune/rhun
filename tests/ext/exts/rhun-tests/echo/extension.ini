# The echo extension, for the host tests. See tests/ext/echo.py.
name = echo
owner = rhun-tests
title = Echo
version = 0.0.1
protocol = 1
runtime = python3
run = ../../../echo.py
on = command

[commands]
shout = Shout | ctrl+alt+shift+u
hi = Say Hi
toast = Echo Toast
stale = Stale Edit
status = Echo Status
open = Echo Open
bad = Bad Range
mb = Multibyte Range
sel = Select Word
relopen = Relative Open
diag = Diagnostics
nodiag = Clear Diagnostics
baddiag = Bad Diagnostics
stalediag = Stale Diagnostics

[subscribe]
opened = *
saved = *
changed = *
cursor = *
hover = *

[needs]
documents = write
